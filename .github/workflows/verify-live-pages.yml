name: Verify published Pages activity

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-live-pages.mjs"
      - ".github/workflows/verify-live-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Confirm deployed homepage, activity page and JSON match repository
        run: node scripts/verify-live-pages.mjs
