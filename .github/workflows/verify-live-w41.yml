name: Verify released W41 LAB page (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-live-w41.mjs"
      - ".github/workflows/verify-live-w41.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Diagnose repository and live image file format
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Repository image"
          file assets/projects/evidence/tuki-project-evidence.webp
          xxd -l 24 assets/projects/evidence/tuki-project-evidence.webp
          echo "::endgroup::"
          echo "::group::Published image"
          curl --silent --show-error --location --compressed --fail \
            --dump-header "$RUNNER_TEMP/w41-image-headers.txt" \
            --output "$RUNNER_TEMP/w41-image-response.bin" \
            'https://tuki0609.github.io/tuki-lab/assets/projects/evidence/tuki-project-evidence.webp'
          grep -Ei '^(content-type|content-encoding|content-length|HTTP/)' "$RUNNER_TEMP/w41-image-headers.txt" || true
          file "$RUNNER_TEMP/w41-image-response.bin"
          xxd -l 24 "$RUNNER_TEMP/w41-image-response.bin"
          echo "::endgroup::"
      - name: Fetch real published JSON, metadata, styles, WebP bytes
        run: node scripts/verify-live-w41.mjs
      - name: Open public LAB pages in headless Chrome and verify screenshots appear in DOM
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "Chrome unavailable"; exit 1; fi
          URL="https://tuki0609.github.io/tuki-lab/lab/article/?slug=lutratide-evolution-growth-difference-2026-w41&verify=$GITHUB_RUN_ID"
          timeout 80 "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --virtual-time-budget=14000 --window-size=1180,3000 --dump-dom "$URL" \
            > "$RUNNER_TEMP/w41-live-dom.html" 2> "$RUNNER_TEMP/w41-chrome.log"
          grep -Fq '진화했는데 손맛이 그대로라면' "$RUNNER_TEMP/w41-live-dom.html"
          grep -Fq '이번 제작에서 남긴 기준' "$RUNNER_TEMP/w41-live-dom.html"
          grep -Fq '게임 제작 과정의 실제 화면' "$RUNNER_TEMP/w41-live-dom.html"
          grep -Fq '기존 프로젝트에 등록된 플레이 참고 화면입니다' "$RUNNER_TEMP/w41-live-dom.html"
          for title in '성장 선택 화면' '전투 플레이 화면' '스킬 이펙트'; do
            grep -Fq "$title" "$RUNNER_TEMP/w41-live-dom.html"
          done
          COUNT="$(grep -o 'class="lab-evidence-card"' "$RUNNER_TEMP/w41-live-dom.html" | wc -l)"
          test "$COUNT" -eq 3
          echo "PASS: Public W41 article rendered full text and all 3 project evidence panels in desktop Chrome."
          timeout 80 "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --virtual-time-budget=14000 --window-size=390,844 --dump-dom "$URL" \
            > "$RUNNER_TEMP/w41-mobile-dom.html" 2> "$RUNNER_TEMP/w41-mobile-chrome.log"
          MCOUNT="$(grep -o 'class="lab-evidence-card"' "$RUNNER_TEMP/w41-mobile-dom.html" | wc -l)"
          test "$MCOUNT" -eq 3
          echo "PASS: Mobile-size viewport also rendered all 3 project evidence panels."
          timeout 80 "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --virtual-time-budget=12000 --dump-dom \
            "https://tuki0609.github.io/tuki-lab/lab/?verify=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/lab-index-dom.html" 2> "$RUNNER_TEMP/lab-index-chrome.log"
          grep -Fq 'lutratide-evolution-growth-difference-2026-w41' "$RUNNER_TEMP/lab-index-dom.html"
          echo "PASS: TUKI LAB listing includes W41 article."
          timeout 80 "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --virtual-time-budget=12000 --dump-dom \
            "https://tuki0609.github.io/tuki-lab/lab/article/?slug=momo-public-launch-2026-10-07&verify=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/momo-dom.html" 2> "$RUNNER_TEMP/momo-chrome.log"
          if grep -Fq 'class="lab-evidence-card"' "$RUNNER_TEMP/momo-dom.html"; then
            echo "FAIL: Existing MOMO article unexpectedly acquired W41 gallery."
            exit 1
          fi
          echo "PASS: Previously published MOMO article remains without W41 gallery."
