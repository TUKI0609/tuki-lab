name: Validate TUKI PROMPT BOX staging

on:
  pull_request:
    branches: [main]
    paths:
      - "prompts/**"
      - "content/prompts.json"
      - "content/site.json"
      - "content/i18n.json"
      - "index.html"
      - "js/prompts.js"
      - "css/prompts.css"
      - "css/style.css"
      - "scripts/verify-prompt-box.mjs"
      - "tests/prompt-box.test.mjs"
      - "sitemap.xml"
      - ".github/workflows/prompt-box-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS syntax and structured prompt metadata
        run: |
          node --check js/prompts.js
          node --check scripts/verify-prompt-box.mjs
          node --check scripts/activate-prompt-previews.mjs
          node scripts/activate-prompt-previews.mjs --check
          node --test tests/*.test.mjs
      - name: Verify static LAB articles and sitemap remain reproducible
        run: node scripts/build-lab-search-pages.mjs --check
      - name: Exercise live browser clipboard, search and mobile navigation on staged site
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/prompt-box-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/prompts/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-prompt-box.mjs
