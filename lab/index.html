<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TUKI LAB · TUKI WORLD</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="lab">
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="../"><span>TUKI WORLD</span><small>TUKI LAB</small></a>
      <nav id="main-nav" aria-label="주요 메뉴"></nav>
    </div>
  </header>
  <main>
    <section class="page-hero wrap">
      <p class="eyebrow" data-i18n="lab.eyebrow">TUKI LAB</p>
      <h1 data-i18n="lab.title">만드는 과정도 결과물입니다.</h1>
      <p data-i18n="lab.desc">제작 기록, 실험, 수정, 공개, 회고, 결정을 한곳에 쌓습니다.</p>
    </section>
    <section class="section wrap">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="lab.published">정식 제작 기록</p>
          <h2 data-i18n="lab.approved">승인된 제작 기록.</h2>
        </div>
        <p><span data-i18n="lab.approvedDesc">외부 활동을 그대로 복사하지 않고, 변화의 이유와 배운 점을 다시 정리한 정식 글입니다.</span></p>
      </div>
      <div id="published-lab" class="lab-post-grid"></div>
    </section>

    <section class="section wrap">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="lab.timeline">변화 기록</p>
          <h2 data-i18n="lab.timelineTitle">짧은 변화 기록.</h2>
        </div>
        <p><span data-i18n="lab.timelineDesc">사이트 구조 변경, 수정, 결정처럼 긴 글이 필요하지 않은 이력까지 함께 남깁니다.</span></p>
      </div>
      <div id="all-logs" class="devlog-list devlog-list-full"></div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><strong>TUKI WORLD</strong><span>© <span data-year></span> TUKI.</span></div></footer>
  <script type="module" src="../js/secondary.js"></script>
</body>
</html>
